name: Daily US Update

# 매일 한국시간 06:30 (UTC 21:30 전날) 자동 실행
# 수동 실행도 가능 (workflow_dispatch)
on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    # NYSE 추가로 대상 종목이 약 2배(2,431 → 4,000+) → 실행시간 40~50분 예상.
    # 기존 60분은 여유가 부족해 중단 위험이 있어 120분으로 상향.
    timeout-minutes: 120

    permissions:
      contents: write

    steps:
      - name: 📁 리포 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: 📦 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests python-dotenv

      # NYSE/AMEX 티커 목록 갱신 (없거나 오래되면 재생성)
      #   screener.py 는 nyse_tickers.csv 가 있으면 자동으로 나스닥 목록과 합친다.
      - name: 🗽 NYSE 티커 목록 갱신
        continue-on-error: true      # 실패해도 기존 CSV 로 진행
        run: |
          python build_nyse_tickers.py --out nyse_tickers.csv
          wc -l nyse_tickers.csv

      - name: 🔍 Screener 실행 (US 1900+ 종목)
        run: python screener.py

      - name: 🎨 섹터 정보 보강 (GICS 매칭)
        run: python enrich_sectors.py

      # ─── [추가] 전략실 테마 카탈리스트 주입 ───
      # enrich 다음 / 업로드 앞에 위치해야 함:
      #   screener_data.json 에 industry 가 채워진 뒤 catalyst 를 계산하고,
      #   그 결과(catalyst 키)가 github_upload.py 업로드에 포함되도록.
      - name: 🎯 전략실 카탈리스트 주입 (catalyst)
        run: python make_catalyst.py

      # ─── [추가] 전략실 forward 페이퍼 트레이딩 엔진 ───
      # make_catalyst 다음(catalyst 키가 채워진 뒤) / 업로드 앞에 위치.
      #   screener_data.json 을 읽어 5게이트 진입·보유관리·청산·NAV 를 누적해
      #   strategy_room.json 을 생성한다.
      #   strategy_room.json 은 아래 commit 단계에서 repo 에 저장되어
      #   (1) GitHub Pages 가 대시보드 옆에서 서빙하고,
      #   (2) 다음날 checkout 시 복원되어 forward 상태가 누적된다.
      #   (stdlib 만 사용 — 추가 패키지 불필요)
      - name: 🏛 전략실 엔진 (strategy_room)
        run: python strategy_room_v1.py output/screener_data.json strategy_room.json

      - name: ☁️ GitHub 업로드 (dashboard.html + screener_data.json + phase_history.json)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: trend-pilot
          GITHUB_REPO: screener
        run: python github_upload.py

      # 전략실 엔진 결과 확인 (조용한 실패 조기 발견)
      - name: 🔎 strategy_room.json 검증
        run: |
          python - <<'PY'
          import json, sys, datetime
          try:
              sr = json.load(open("strategy_room.json", encoding="utf-8"))
          except Exception as e:
              print(f"::error::strategy_room.json 읽기 실패 — {e}"); sys.exit(1)
          d = sr.get("data_date") or "?"
          print(f"strategy_room data_date = {d} · NAV={sr.get('nav')} "
                f"· 보유={len(sr.get('holdings') or [])} · 신호={len(sr.get('signals') or [])}")
          try:
              age = (datetime.date.today() - datetime.date.fromisoformat(str(d))).days
              if age > 5:
                  print(f"::warning::전략실 데이터가 {age}일 지연됨 (data_date={d}) — 엔진이 새 거래일을 만들지 못했습니다")
          except Exception:
              print(f"::warning::data_date 파싱 불가: {d}")
          PY

      - name: 💾 캐시/상태 commit (sector_cache + catalyst_state + strategy_room)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # [중요] screener_data.json / phase_history.json 은 github_upload.py 가
          #   GitHub API 로 '이미' 푸시했다. 그런데 로컬 working tree 에도 수정본이
          #   남아 있어서, 커밋하지 않은 채 merge 하면 git 이 거부한다:
          #     "error: Your local changes to the following files would be
          #      overwritten by merge: screener_data.json → Aborting"
          #   → API 로 올라간 파일들의 로컬 변경은 버리고 원격 버전을 따른다.
          for f in screener_data.json output/screener_data.json \
                   phase_history.json kr_phase_history.json; do
            git checkout -- "$f" 2>/dev/null || true
          done
          # 그래도 남은 추적 파일 변경이 있으면 merge 가 막히므로 확인용으로 출력
          git status --porcelain
          # 상태 파일은 매 실행 새로 생성되는 산출물 → 충돌 시 '이번 실행분' 우선
          git add sector_cache.json catalyst_state.json strategy_room.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경 없음 — 상태 파일이 어제와 동일합니다 (엔진 미진행 가능성 점검 필요)"
          else
            git commit -m "🎨 sector_cache + 🎯 catalyst_state + 🏛 strategy_room [auto]"
            # 재시도 + 충돌 시 이번 실행분 채택 (stash 미사용 → 조용한 유실 방지)
            for i in 1 2 3; do
              git fetch origin main
              git merge -X ours origin/main -m "merge: keep this run's state" || { echo "merge 실패"; exit 1; }
              git push origin main && break
              echo "push 재시도 $i"; sleep 5
            done
          fi
