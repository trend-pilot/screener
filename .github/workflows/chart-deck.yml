name: Chart Deck (베이스 카운트 차트)

# 수동 실행 전용 — Actions 탭에서 티커를 입력하고 버튼만 누르면 된다.
#   결과는 charts/ 폴더에 커밋되고 GitHub Pages 로 바로 열람 가능:
#   https://trend-pilot.github.io/screener/charts/latest.html
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: '티커 (공백으로 구분). 비우면 스크리너 상위 종목 자동 선별'
        required: false
        default: ''
      mode:
        description: '선별 기준 (티커 미입력 시)'
        required: false
        default: 'stage2'
        type: choice
        options:
          - stage2      # RS 상위 + 추세템플릿 Stage2
          - rs-accel    # RS 가속 + RS 라인 신고가
          - phase4      # 베이스 Phase 4 (돌파 임박/직후)
          - all         # RS 상위만
      top:
        description: '자동 선별 시 종목 수'
        required: false
        default: '15'
      min_rs:
        description: '자동 선별 시 RS 하한'
        required: false
        default: '80'
      years:
        description: '차트 기간 (년)'
        required: false
        default: '2'

permissions:
  contents: write

jobs:
  deck:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📁 리포 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 패키지 설치
        run: pip install --quiet yfinance pandas numpy

      - name: 📈 차트덱 생성
        run: |
          mkdir -p charts
          TICKERS="${{ github.event.inputs.tickers }}"
          if [ -z "$TICKERS" ]; then
            echo "티커 미입력 → screener_data.json 에서 자동 선별"
            python make_chart_deck.py \
              --from-json output/screener_data.json \
              --mode "${{ github.event.inputs.mode }}" \
              --top "${{ github.event.inputs.top }}" \
              --min-rs "${{ github.event.inputs.min_rs }}" \
              --years "${{ github.event.inputs.years }}" \
              --out charts/latest.html
          else
            echo "지정 티커: $TICKERS"
            python make_chart_deck.py $TICKERS \
              --years "${{ github.event.inputs.years }}" \
              --out charts/latest.html
          fi
          # 날짜별 사본도 남겨 이력 확인 가능
          cp charts/latest.html "charts/deck_$(date -u +%Y-%m-%d_%H%M).html"
          ls -la charts/

      - name: 💾 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "📈 chart deck $(date -u +%Y-%m-%d\ %H:%M) [auto]"
            for i in 1 2 3; do
              git fetch origin main
              git merge -X ours origin/main -m "merge: keep chart deck" || { echo "merge 실패"; exit 1; }
              git push origin main && break
              echo "push 재시도 $i"; sleep 5
            done
          fi

      - name: 🔗 열람 주소 안내
        run: |
          echo "### 📈 차트덱 생성 완료" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "https://trend-pilot.github.io/screener/charts/latest.html" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "(반영까지 1~2분 걸릴 수 있습니다)" >> $GITHUB_STEP_SUMMARY
