name: stockeasy daily

on:
  schedule:
    - cron: '30 7 * * 1-5'
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install beautifulsoup4

      - name: Fetch stockeasy
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python stockeasy_fetch.py --strategy momentum

     - name: Commit snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stockeasy_kr.json stockeasy_history.jsonl
          git diff --staged --quiet || git commit -m "stockeasy snapshot $(date -u +%Y-%m-%d)"
          git push

      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode=HTML \
            -d text="🔥 <b>스탁이지 수집 실패</b>%0A워크플로가 중단됐습니다.%0A${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
