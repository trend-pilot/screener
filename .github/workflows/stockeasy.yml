name: stockeasy daily

on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * 1-5'
  workflow_run:
    workflows: ["Daily KR Update"]
    types:
      - completed

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install beautifulsoup4 pykrx

      - name: Fetch stockeasy
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python stockeasy_fetch.py --strategy momentum

      - name: Enrich OHLCV
        run: python enrich_kr.py

      - name: Paper engine
        run: python strategy_room_kr_v1.py

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in stockeasy_kr.json stockeasy_history.jsonl kr_ohlcv_extra.json strategy_room_kr.json strategy_room_kr_cap12.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "kr pipeline $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="KR pipeline failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
